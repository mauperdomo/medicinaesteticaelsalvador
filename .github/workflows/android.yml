# Compila el APK de Android en cada cambio y lo publica en la versión «android-latest».
name: Android APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ya incluye el SDK de Android (ANDROID_HOME) con las licencias aceptadas.

      - name: Instalar dependencias y copiar la app web
        run: |
          npm ci
          npm run android:sync

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../vademecum-inyectables.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vademecum-inyectables-apk
          path: vademecum-inyectables.apk

      - name: Publicar en la versión android-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest vademecum-inyectables.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Vademécum Inyectables – APK de Android" \
            --notes "Compilado desde ${GITHUB_SHA::7}. Descarga el APK en el celular y ábrelo para instalar (permite «instalar apps de origen desconocido»)."
